# Lumio behind nginx. Copy to /etc/nginx/conf.d/lumio.conf (or sites-available), replace
# chat.example.com and rtc.example.com with LUMIO_DOMAIN and LIVEKIT_DOMAIN, point the
# certificate paths at yours (e.g. from certbot) and reload nginx.
# Start Lumio with docker-compose.proxy.yml, which publishes the app on 127.0.0.1:3000.
# Needs nginx 1.25.1 or later for `http2 on`; on older versions use `listen 443 ssl http2`.

# WebSockets: pass the Upgrade header on, and close the connection otherwise.
map $http_upgrade $connection_upgrade {
	default upgrade;
	'' close;
}

server {
	listen 80;
	listen [::]:80;
	server_name chat.example.com rtc.example.com;
	return 301 https://$host$request_uri;
}

# The app.
server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name chat.example.com;

	ssl_certificate /etc/letsencrypt/live/chat.example.com/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/chat.example.com/privkey.pem;

	# Files are uploaded in 8 MB pieces; the app accepts request bodies up to 16 MB.
	client_max_body_size 16m;

	location / {
		proxy_pass http://127.0.0.1:3000;
		proxy_http_version 1.1;

		proxy_set_header Host $host;
		# The app reads the client's address from the last entry (XFF_DEPTH=1). With another
		# proxy or a CDN in front of nginx, raise XFF_DEPTH accordingly.
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Forwarded-Host $host;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;

		# Live updates are Server-Sent Events: send every event on at once and keep the
		# stream open. Uploads go straight through instead of being stored first.
		proxy_buffering off;
		proxy_request_buffering off;
		proxy_read_timeout 1h;
		proxy_send_timeout 1h;
	}

	# Alternative to a second domain: serve LiveKit from a path of the app domain. Set
	# LIVEKIT_URL=wss://chat.example.com/livekit in .env and remove the server block below.
	# location /livekit/ {
	# 	proxy_pass http://127.0.0.1:7880/;
	# 	proxy_http_version 1.1;
	# 	proxy_set_header Host $host;
	# 	proxy_set_header Upgrade $http_upgrade;
	# 	proxy_set_header Connection $connection_upgrade;
	# 	proxy_read_timeout 1h;
	# }
}

# LiveKit signaling (WebSocket). Media goes directly to LiveKit over UDP, not through nginx.
server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name rtc.example.com;

	ssl_certificate /etc/letsencrypt/live/rtc.example.com/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/rtc.example.com/privkey.pem;

	location / {
		proxy_pass http://127.0.0.1:7880;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
		proxy_read_timeout 1h;
		proxy_send_timeout 1h;
	}
}
