# Dependency updates, grouped so a solo maintainer gets few PRs per week.
version: 2
updates:
  - package-ecosystem: npm # also handles pnpm workspaces via pnpm-lock.yaml
    directory: /
    schedule:
      interval: weekly
      day: saturday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Electron majors need manual testing of the desktop shell.
      - dependency-name: electron
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directories: [/apps/web]
    schedule:
      interval: monthly

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
