name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Run by the release workflow before an image is published.
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lumio
          POSTGRES_PASSWORD: lumio
          POSTGRES_DB: lumio
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U lumio" --health-interval 5s --health-retries 10
    env:
      CI: true
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      DATABASE_URL: postgres://lumio:lumio@localhost:5432/lumio
      ORIGIN: http://localhost:4173
      BETTER_AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      LIVEKIT_URL: ws://localhost:7880
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: devsecret_change_me_devsecret_change_me
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lumio/web exec playwright install --with-deps chromium
      - run: pnpm lint
      - run: .github/scripts/next-version.test.sh
      - run: pnpm check
      - run: pnpm test:unit
      - run: pnpm --filter @lumio/web exec node scripts/migrate.js
      # LiveKit for the call tests, same as in docker-compose.dev.yml. Service containers
      # cannot take a command, so it is started here.
      - name: Start LiveKit
        run: |
          docker run -d --name livekit --network host livekit/livekit-server:v1.9 \
            --dev --bind 0.0.0.0 --keys "devkey: devsecret_change_me_devsecret_change_me"
          timeout 60 sh -c 'until curl -sf http://localhost:7880 > /dev/null; do sleep 1; done'
      - run: pnpm test:e2e

  # Builds the Docker image and runs it behind the example nginx config, as a self-hoster would.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          load: true
          # The name docker-compose.yml uses, so the test starts this image instead of pulling one.
          tags: ghcr.io/sniphs98/lumio:ci
          cache-from: type=gha
      - name: Test behind a reverse proxy
        run: .github/scripts/reverse-proxy-test.sh
        env:
          LUMIO_IMAGE: ghcr.io/sniphs98/lumio:ci
