# Publishes ghcr.io/sniphs98/lumio:edge (and sha-<commit>) once CI has passed on main, to try
# out changes before they are released. Version tags are published by release.yml.
name: Edge image

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: edge
  cancel-in-progress: true

jobs:
  image:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      # The commit CI tested, which may be older than the newest commit on main.
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.HEAD_SHA }}
      - id: commit
        run: echo "short=${HEAD_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=edge
            type=raw,value=sha-${{ steps.commit.outputs.short }}
          labels: |
            org.opencontainers.image.revision=${{ env.HEAD_SHA }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
