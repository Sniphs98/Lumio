# Publishes the Docker image to ghcr.io and creates a GitHub release.
#
# Every push to main that passes CI is released automatically. The version bump comes from
# the merged pull requests (branch prefix or release:* label), see "Releases" in README.md
# and .github/scripts/next-version.sh. Pushing a version tag by hand (git tag v1.2.3 &&
# git push origin v1.2.3) still works, and a manual run on a branch only builds the image.
name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# One release at a time, so two merges never get the same version. A run that is cancelled
# while waiting is covered by the next one, which looks at everything since the last release.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.next.outputs.tag || steps.manual.outputs.tag }}
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      # For CI runs, the commit CI tested, which may be older than the newest commit on main.
      - id: sha
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: echo "sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
      - if: github.event_name == 'workflow_run'
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.sha.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true
      - if: github.event_name == 'workflow_run'
        id: next
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/next-version.sh "${{ steps.sha.outputs.sha }}" >> "$GITHUB_OUTPUT"
      - if: github.ref_type == 'tag'
        id: manual
        run: echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

  # CI already passed for automatic releases; tags and manual runs are tested here.
  test:
    needs: version
    if: github.event_name != 'workflow_run'
    uses: ./.github/workflows/ci.yml

  image:
    needs: [version, test]
    # Also on main when nothing is released (release:skip), to keep edge up to date.
    if: >-
      always() && needs.version.result == 'success' &&
      (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ needs.version.outputs.tag }}
      SHA: ${{ needs.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
      - id: commit
        run: echo "short=${SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # v1.2.3 -> 1.2.3, 1.2, 1 and latest; for 0.x the major tag is skipped. Pre-releases
          # (v1.3.0-beta.1) only get their own tag. Every build from main is also edge and
          # sha-<commit>. A manual run on a branch gets the branch name and commit.
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }},enable=${{ env.TAG != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }},enable=${{ env.TAG != '' }}
            type=semver,pattern={{major}},value=${{ env.TAG }},enable=${{ env.TAG != '' && !startsWith(env.TAG, 'v0.') }}
            type=raw,value=latest,enable=${{ env.TAG != '' && !contains(env.TAG, '-') }}
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_run' }}
            type=raw,value=sha-${{ steps.commit.outputs.short }},enable=${{ github.event_name == 'workflow_run' || github.ref_type == 'branch' }}
            type=ref,event=branch,enable=${{ github.event_name == 'workflow_dispatch' }}
          labels: |
            org.opencontainers.image.revision=${{ env.SHA }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: [version, image]
    # always() because the skipped test job would otherwise skip this one too.
    if: always() && needs.image.result == 'success' && needs.version.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    env:
      TAG: ${{ needs.version.outputs.tag }}
      SHA: ${{ needs.version.outputs.sha }}
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The image as files for the release, for machines that cannot pull from ghcr.io:
      # docker load -i lumio-<version>-linux-amd64.tar.gz
      - name: Export the image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${TAG#v}"
          mkdir dist
          # With the containerd image store, docker save needs the platform too.
          save_flags=()
          for arch in amd64 arm64; do
            docker pull --quiet --platform "linux/$arch" "$image"
            if docker save --help | grep -q -- --platform; then
              save_flags=(--platform "linux/$arch")
            fi
            docker save "${save_flags[@]}" "$image" | gzip > "dist/lumio-${TAG#v}-linux-$arch.tar.gz"
            docker rmi "$image"
          done
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
          ls -lh dist
      - name: Write release notes
        run: |
          repo=${GITHUB_REPOSITORY,,}
          image="ghcr.io/$repo"
          cat > notes.md <<NOTES
          ## Docker image

          \`\`\`sh
          docker pull $image:${TAG#v}
          \`\`\`

          With docker-compose.yml, set \`LUMIO_VERSION=${TAG#v}\` in \`.env\` and run \`docker compose up -d\`. All tags are listed on the [package page]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/pkgs/container/${repo#*/}).

          Without access to ghcr.io, download the image for your platform below and load it with \`docker load -i lumio-${TAG#v}-linux-amd64.tar.gz\`.

          NOTES
          cat notes.md
      # A release made with the workflow token creates its tag without starting this
      # workflow again for the tag push.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags="--generate-notes --notes-file notes.md"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            flags="$flags --verify-tag"
          else
            flags="$flags --target $SHA"
          fi
          case "$TAG" in *-*) flags="$flags --prerelease" ;; esac
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" $flags dist/*
