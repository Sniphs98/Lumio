# Production setup. Copy deploy/.env.example to .env, fill it in, then: docker compose up -d
services:
  app:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://lumio:${POSTGRES_PASSWORD}@postgres:5432/lumio
      ORIGIN: https://${LUMIO_DOMAIN}
      # The client's IP address as Caddy passes it on, used for sign-in and sign-up limits.
      ADDRESS_HEADER: X-Forwarded-For
      XFF_DEPTH: 1
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      LIVEKIT_URL: wss://${LIVEKIT_DOMAIN}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      # Optional tracing, off when empty. See "Tracing" in the README.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      # Optional S3 bucket for shared files. When empty, files are kept in the uploads volume.
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    volumes:
      - uploads:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lumio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: lumio
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lumio']
      interval: 5s
      retries: 10

  # Voice, video and screen sharing. Uses host networking because WebRTC needs
  # many UDP ports; open 7881/tcp, 3478/udp and 50000-60000/udp in your firewall.
  livekit:
    image: livekit/livekit-server:v1.9
    restart: unless-stopped
    network_mode: host
    command: --config /etc/livekit.yaml
    environment:
      LIVEKIT_KEYS: '${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}'
    volumes:
      - ./deploy/livekit.yaml:/etc/livekit.yaml:ro

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      LUMIO_DOMAIN: ${LUMIO_DOMAIN}
      LIVEKIT_DOMAIN: ${LIVEKIT_DOMAIN}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Optional trace viewer, only started with the "tracing" profile. The UI is
  # bound to localhost; open it through an SSH tunnel (ssh -L 16686:localhost:16686).
  # Traces are kept in memory and are lost on restart.
  jaeger:
    image: jaegertracing/jaeger:2.22.0
    restart: unless-stopped
    profiles: [tracing]
    ports:
      - '127.0.0.1:16686:16686'

volumes:
  postgres:
  uploads:
  caddy_data:
  caddy_config:
