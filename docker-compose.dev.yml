# Services for local development. Run: docker compose -f docker-compose.dev.yml up -d
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: lumio
      POSTGRES_PASSWORD: lumio
      POSTGRES_DB: lumio
    ports:
      - '5432:5432'
    volumes:
      - postgres-dev:/var/lib/postgresql/data

  livekit:
    image: livekit/livekit-server:v1.9
    # --node-ip is the address LiveKit announces to browsers for media. The
    # default 127.0.0.1 works when the browser runs on the same machine, also
    # with Docker Desktop and WSL, where auto detection picks an unreachable
    # container address. To join calls from another device in your network,
    # set LIVEKIT_NODE_IP to this machine's LAN IP (in a .env next to this file).
    command:
      - --dev
      - --bind
      - 0.0.0.0
      - --node-ip
      - ${LIVEKIT_NODE_IP:-127.0.0.1}
      - --keys
      - 'devkey: devsecret_change_me_devsecret_change_me'
    ports:
      - '7880:7880'
      - '7881:7881'
      - '7882:7882/udp'

  # Optional trace viewer: docker compose -f docker-compose.dev.yml --profile tracing up -d
  # UI on http://localhost:16686, OTLP/HTTP on port 4318.
  jaeger:
    image: jaegertracing/jaeger:2.22.0
    profiles: [tracing]
    ports:
      - '16686:16686'
      - '4318:4318'

volumes:
  postgres-dev:
